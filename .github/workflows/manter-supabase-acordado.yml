# O plano gratuito do Supabase pausa o projeto depois de 7 dias sem nenhum
# acesso, e quem usa o app lança mais ou menos uma vez por semana — ou seja, em
# cima do limite. Este job toca na API todo dia para o contador nunca chegar
# lá, e falha (avisando por e-mail) se o projeto já estiver fora do ar.
name: Manter o Supabase acordado

on:
  schedule:
    # 12:20 UTC = 09:20 em Chapecó. O horário da fila do GitHub pode atrasar
    # alguns minutos; para este uso não faz diferença.
    - cron: '20 12 * * *'
  workflow_dispatch:

jobs:
  acordar:
    runs-on: ubuntu-latest
    steps:
      - name: Tocar na API do Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -u
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "Faltam os secrets SUPABASE_URL e SUPABASE_ANON_KEY no repositório."
            exit 1
          fi

          # Duas chamadas de propósito: uma no Auth e uma no banco (PostgREST),
          # para o acesso contar mesmo que só uma das partes seja considerada.
          # A chave anon é pública (vai dentro do site) e as regras de RLS não
          # deixam ela ler nada; aqui só importa que o projeto responda.
          falhou=0
          for caminho in "/auth/v1/settings" "/rest/v1/products?select=id&limit=1"; do
            codigo=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
              -H "apikey: ${SUPABASE_ANON_KEY}" \
              "${SUPABASE_URL}${caminho}")
            echo "${caminho} respondeu HTTP ${codigo}"

            # 4xx é resposta normal aqui (a chave anon não tem permissão de
            # leitura). Só 5xx, 000 ou timeout significam projeto pausado ou
            # fora do ar.
            case "${codigo}" in
              2* | 4*) ;;
              *) falhou=1 ;;
            esac
          done

          if [ "${falhou}" = "1" ]; then
            echo "O Supabase não respondeu. Se o projeto pausou, entre no painel e clique em Resume project."
            exit 1
          fi
          echo "Projeto acordado."
